[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-foundations"
version = "0.1.0"
description = "An interactive field guide to the mathematics that makes quantum computing possible."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Quantum Foundations Lab contributors" }]
dependencies = [
  "numpy>=1.26",
]

[project.urls]
Homepage = "https://github.com/Byt-wyze-technology/quantum-foundations-lab"
Repository = "https://github.com/Byt-wyze-technology/quantum-foundations-lab"
Issues = "https://github.com/Byt-wyze-technology/quantum-foundations-lab/issues"
Documentation = "https://github.com/Byt-wyze-technology/quantum-foundations-lab/tree/main/docs"

[project.optional-dependencies]
# Starlette's TestClient needs an HTTP client. Recent versions want `httpx2`
# and emit a deprecation warning when only `httpx` is present; older versions
# import `httpx` directly. Both are listed because this project pins neither
# FastAPI nor Starlette, so a fresh resolve and an existing environment can
# legitimately want different ones.
dev = ["pytest", "hypothesis", "httpx", "httpx2", "mypy", "ruff"]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "pydantic>=2.6"]
streamlit = ["streamlit", "matplotlib"]

[tool.setuptools]
packages = ["quantum_foundations", "quantum_foundations.core", "quantum_foundations.lessons"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  # Our own code must not warn.
  "error",
  # FastAPI 0.115 calls asyncio.iscoroutinefunction, which Python 3.14
  # deprecates. Upstream's to fix; drop this line once FastAPI stops using it.
  "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning",
]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
warn_return_any = true
files = ["quantum_foundations", "apps/web/backend"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
