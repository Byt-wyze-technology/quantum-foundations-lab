name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Core, API and integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Node is installed here too: the cross-implementation check bundles the
      # frontend's mathematics and runs it, and skips silently without Node.
      # Skipping in CI would defeat the point of having the check at all.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/frontend/package-lock.json

      - name: Install Python dependencies
        run: python -m pip install -e ".[dev,web,streamlit]"

      - name: Install frontend dependencies
        working-directory: apps/web/frontend
        run: npm ci

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy

      - name: Test
        run: python -m pytest -q

      - name: Confirm the cross-implementation check actually ran
        run: |
          python -m pytest tests/integration/test_frontend_backend_agreement.py \
            -q --no-header -p no:randomly | tee result.txt
          if grep -qi "skipped" result.txt; then
            echo "::error::The frontend/backend agreement check skipped in CI."
            exit 1
          fi

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/frontend/package-lock.json

      - run: npm ci

      - name: Type check
        run: npx tsc -b

      - name: Unit and component tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/frontend/playwright-report/
          retention-days: 7

  figures:
    name: Figures regenerate cleanly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: python -m pip install -e ".[dev,streamlit]"

      # The figures are computed from the core, so they must still build. This
      # does not fail on pixel differences — only on a script that has stopped
      # working, which would otherwise go unnoticed until a release.
      - name: Regenerate figures
        run: python scripts/make_readme_figures.py
